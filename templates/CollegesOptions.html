<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <link rel="stylesheet" href="/static/CollegeOptions.css">
    <script src="/static/CollegeOptions.js" defer></script>
</head>

<body>
    <div class="content">
        <div class="split-container">
            <div class="side-panel">
                <div class="input-bar">
                    <div class="input-group">
                        <label>College Name</label>
                        <input type="text" id="collegeNameInput" placeholder="Enter college name">
                    </div>
                    <button id="addCollegeBtn">Add College</button>
                </div>
                <div id="collegeContainer">
                </div>
            </div>

            <div class="separator"></div>

            <div class="side-panel">
                <div class="input-bar">
                    <div class="input-group">
                        <label>Select College</label>
                        <select id="deptCollegeSelect">
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Department Name</label>
                        <input type="text" id="deptNameInput" placeholder="Enter department">
                    </div>
                    <button id="addDeptBtn">Add Dept</button>
                </div>
                <div id="departmentContainer">
                </div>
            </div>
        </div>

        <div id="passwordModal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h3>Confirm Deletion</h3>
                <p id="modalUserInfo">Please enter your password to confirm deleting this college.</p>
                <div class="input-group">
                    <label>Admin Password</label>
                    <input type="password" id="deleteConfirmPass" placeholder="••••••••">
                </div>
                <div class="input-group" style="margin-top: 10px;">
                    <label>Confirm Password</label>
                    <input type="password" id="deleteConfirmCheck" placeholder="••••••••">
                </div>
                <div class="modal-actions">
                    <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
                    <button id="confirmDeleteBtn" class="btn-modal-confirm">Delete Permanently</button>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="NavName">
            <h1>الرئيسية</h1>
        </div>
        <ul class="NavOps">
            <li><a href="/MainAdmin">الرئيسية</a></li>
            <li><a href="/RequestsAdmin">الطلبات</a></li>
            <li><a href="/AccountsAdmin">الحسابات</a></li>
        </ul>
        <div class="OptionsContainer">
            <button class="OptionsToggle" onclick="toggleOptions()">الاعدادات</button>
            <div id="OptionsList" class="SubMenu">
                <a href="/OptionsAdmin/College">الكلية-القسم</a>
            </div>
        </div>
    </div>
</body>

</html>
