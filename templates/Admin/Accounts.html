<!DOCTYPE html>
<html lang="AR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/icon.ico" type="image/x-icon">
    <title>الطلبة المرقنين</title>
    <link rel="stylesheet" href="/static/CSS/Accounts.css">
    <script src="/static/JS/Admin/Accounts.js" defer></script>

</head>

<body>
    <div class="content">
        <div class="filter-bar">

            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="usernameInput" placeholder="ادخل اسم المستخدم">
            </div>

            <div class="input-group">
                <label>الكلية</label>
                <select id="collegeInput">
                    <option value=''>غير محدد</option>
                </select>
            </div>

            <div class="input-group">
                <label>الرمز السري</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>

            <div class="input-group">
                <label>تأكيد الرمز</label>
                <input type="password" id="confirmPasswordInput" placeholder="••••••••">
            </div>

            <button id="addAccountBtn">اضافة حساب</button>
            <button id="DisableAllBtn" onclick="toggleAllUsers(false)">تعطيل الكل</button>
            <button id="EnableAllBtn"  onclick="toggleAllUsers(true)">تفعيل الكل</button>


        </div>

        <div id="accountContainer">
        </div>

        <div id="passwordModal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h3>تأكيدالحذف</h3>
                <div class="input-group">
                    <label>الرمز السري</label>
                    <input type="password" id="deleteConfirmPass" placeholder="••••••••">
                </div>
                <div class="input-group" style="margin-top: 10px;">
                    <label>تأكيد الرمز</label>
                    <input type="password" id="deleteConfirmCheck" placeholder="••••••••">
                </div>
                <div class="modal-actions">
                    <button class="btn-modal-cancel" onclick="closeModal()">الغاء</button>
                    <button id="confirmDeleteBtn" class="btn-modal-confirm">حذف</button>
                </div>
            </div>
        </div>

        <div id="changePassModal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h3>تغير رمز الحساب</h3>
                <div class="input-group">
                    <label>الرمز الجديد</label>
                    <input type="password" id="newPassInput" placeholder="••••••••">
                </div>

                <div class="input-group" style="margin-top: 10px;">
                    <label>تأكيد الرمز الجديد</label>
                    <input type="password" id="confirmNewPassInput" placeholder="••••••••">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" onclick="closePassModal()">الغاء</button>
                    <button id="confirmChangeBtn" class="btn-modal-confirm"
                        style="background-color: #e0f2fe; color: #0369a1; border-color: #bae6fd;">تغير</button>
                </div>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <div class="NavName">
            <h1>{{ role }}</h1>
        </div>
        <ul class="NavOps">
            <li><a href="/Admin/Main">الرئيسية</a></li>
            <li><a href="/Admin/Requests">الطلبات</a></li>
            <li><a href="/Admin/Accounts">الحسابات</a></li>
            <div class="OptionsContainer">
                <button class="OptionsToggle" onclick="toggleOptions()">▼ الاعدادات</button>
                <div id="OptionsList" class="SubMenu">
                    <a href="/Admin/CollegesOptions">الكلية-القسم</a>
                    <a href="/Admin/StudyOptions">المرحلة الدراسية</a>
                    <a href="/Admin/JobOptions">الحالة الوظيفية</a>
                    <a href="/Admin/StatusOptions">موقف الطلب</a>
                    <a href="/Admin/EduYearOptions">سنة دراسية</a>
                    <a href="/Admin/ReqYearOptions">سنة الطلب</a>
                </div>
            </div>
            <li><a href="/logout">تسجيل الخروج</a></li>
        </ul>
    </div>
</body>

</html>
