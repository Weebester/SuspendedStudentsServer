<!DOCTYPE html>
<html lang="AR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <link rel="stylesheet" href="/static/CSS/Admin/Accounts.css">
    <script src="/static/JS/Admin/Accounts.js" defer></script>

</head>

<body>
    <div class="content">
        <div class="filter-bar">
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="usernameInput" placeholder="ادخل اسم المستخدم">
            </div>
            <div class="input-group">
                <label>الكلية</label>
                <select id="collegeInput">
                </select>
            </div>
            <div class="input-group">
                <label>الرمز السري</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>

            <div class="input-group">
                <label>تأكيد الرمز</label>
                <input type="password" id="confirmPasswordInput" placeholder="••••••••">
            </div>

            <button id="addAccountBtn">اضافة حساب</button>
            <button id="DisableAllBtn">تعطيل الكل</button>
            <button id="EnableAllBtn">تفعيل الكل</button>




        </div>

        <div id="accountContainer">
        </div>

        <div id="passwordModal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h3>Confirm Deletion</h3>
                <p id="modalUserInfo">Please enter your password to confirm deleting this college.</p>
                <div class="input-group">
                    <label>Admin Password</label>
                    <input type="password" id="deleteConfirmPass" placeholder="••••••••">
                </div>
                <div class="input-group" style="margin-top: 10px;">
                    <label>Confirm Password</label>
                    <input type="password" id="deleteConfirmCheck" placeholder="••••••••">
                </div>
                <div class="modal-actions">
                    <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
                    <button id="confirmDeleteBtn" class="btn-modal-confirm">Delete Permanently</button>
                </div>
            </div>
        </div>

        <div id="changePassModal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h3>Change Password</h3>
                <p id="changePassUserInfo">Enter a new password for this account.</p>

                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="newPassInput" placeholder="••••••••">
                </div>

                <div class="input-group" style="margin-top: 10px;">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmNewPassInput" placeholder="••••••••">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" onclick="closePassModal()">Cancel</button>
                    <button id="confirmChangeBtn" class="btn-modal-confirm"
                        style="background-color: #e0f2fe; color: #0369a1; border-color: #bae6fd;">Update
                        Password</button>
                </div>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <div class="NavName">
            <h1>الرئيسية</h1>
        </div>
        <ul class="NavOps">
            <li><a href="/Admin/Main">الرئيسية</a></li>
            <li><a href="/Admin/Requests">الطلبات</a></li>
            <li><a href="/Admin/Accounts">الحسابات</a></li>
        </ul>
        <div class="OptionsContainer">
            <button class="OptionsToggle" onclick="toggleOptions()">▼ الاعدادات</button>
            <div id="OptionsList" class="SubMenu">
                <a href="/Admin/CollegesOptions">الكلية-القسم</a>
                <a href="/Admin/CollegesOptions">سنة دراسية</a>
                <a href="/Admin/CollegesOptions">سنة الطلب</a>
                <a href="/Admin/CollegesOptions">نوع الدراسة</a>
                <a href="/Admin/CollegesOptions">الحالة الوظيفية</a>
                <a href="/Admin/CollegesOptions">حالة الطلب</a>
            </div>
        </div>



    </div>
</body>

</html>
