<!DOCTYPE html>
<html lang="AR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <link rel="stylesheet" href="/static/CSS/Admin/CollegeOptions.css">
    <script src="/static/JS/Admin/CollegeOptions.js" defer></script>
</head>

<body>
    <div class="content">
        <div class="split-container">
            <div class="side-panel">
                <div class="input-bar">

                    <div class="input-group">
                        <label>اسم الكلية</label>
                        <input type="text" id="collegeNameInput" placeholder="ادخل الاسم">
                    </div>

                    <button id="addCollegeBtn">اضافة كلية</button>

                </div>
                <div id="collegeContainer">
                </div>
            </div>
            <div class="separator"></div>
            <div class="side-panel">
                <div class="input-bar">
                    <div class="input-group">
                        <label>اختر الكلية</label>
                        <select id="deptCollegeSelect">
                        </select>
                    </div>

                    <div class="input-group">
                        <label>اسم القسم</label>
                        <input type="text" id="deptNameInput" placeholder="ادخل الاسم">
                    </div>
                    <button id="addDeptBtn">اضافة قسم</button>
                </div>
                <div id="departmentContainer">
                </div>
            </div>




        </div>

        <div id="passwordModal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h3>Confirm Deletion</h3>
                <p id="modalUserInfo">Please enter your password to confirm deleting this college.</p>
                <div class="input-group">
                    <label>Admin Password</label>
                    <input type="password" id="deleteConfirmPass" placeholder="••••••••">
                </div>
                <div class="input-group" style="margin-top: 10px;">
                    <label>Confirm Password</label>
                    <input type="password" id="deleteConfirmCheck" placeholder="••••••••">
                </div>
                <div class="modal-actions">
                    <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
                    <button id="confirmDeleteBtn" class="btn-modal-confirm">Delete Permanently</button>
                </div>
            </div>
        </div>

        <div id="changeNameModal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h3>Rename College</h3>
                <p id="changePassUserInfo">Enter a New Name</p>

                <div class="input-group">
                    <label>New Name</label>
                    <input type="text" id="newNameInput" placeholder="new name">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" onclick="closePassModal()">Cancel</button>
                    <button id="confirmChangeBtn" class="btn-modal-confirm"
                        style="background-color: #e0f2fe; color: #0369a1; border-color: #bae6fd;">Update
                        Password</button>
                </div>
            </div>
        </div>

    </div>

    <div class="sidebar">
        <div class="NavName">
            <h1>مشرف</h1>
        </div>
        <ul class="NavOps">
            <li><a href="/Admin/Main">الرئيسية</a></li>
            <li><a href="/Admin/Requests">الطلبات</a></li>
            <li><a href="/Admin/Accounts">الحسابات</a></li>
        </ul>
        <div class="OptionsContainer">
            <button class="OptionsToggle" onclick="toggleOptions()">▼ الاعدادات</button>
            <div id="OptionsList" class="SubMenu">
                <a href="/Admin/CollegesOptions">الكلية-القسم</a>
                <a href="/Admin/CollegesOptions">سنة دراسية</a>
                <a href="/Admin/CollegesOptions">سنة الطلب</a>
                <a href="/Admin/CollegesOptions">نوع الدراسة</a>
                <a href="/Admin/CollegesOptions">الحالة الوظيفية</a>
                <a href="/Admin/CollegesOptions">حالة الطلب</a>
            </div>
        </div>
    </div>
</body>

</html>
