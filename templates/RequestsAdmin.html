<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello</title>
    <link rel="stylesheet" href="/static/RequestsAdmin.css">
    <script src="/static/RequestsAdmin.js" defer></script>
</head>

<body>

    <div class="content">
        <div class="dashboard-container">
            <div class="filter-bar">
                <div class="input-group">
                    <label>YEAR FILTER</label>
                    <select id="yearInput">
                        <option value="">Any</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>COLLEGE FILTER</label>
                    <select id="collegeInput">
                        <option value="">Any</option>
                    </select>

                </div>
                <span class="emptybox"></span>
                <button class="status-btn active" data-status="All">All</button>
                <button class="status-btn" data-status="Pending">Pending</button>
                <button class="status-btn" data-status="Accepted">Accepted</button>
                <button class="status-btn" data-status="Denied">Denied</button>
                <button class="download-btn"
                    onclick="window.location.href='/download-excel?year='+ document.getElementById('yearInput').value">Excel</button>

            </div>

            <div id="ticketContainer" class="ticket-grid"></div>
        </div>

    </div>

    <div class="sidebar">
        <div class="NavName">
            <h1>الرئيسية</h1>
        </div>
        <ul class="NavOps">
            <li><a href="/MainAdmin">الرئيسية</a></li>
            <li><a href="/RequestsAdmin">الطلبات</a></li>
            <li><a href="/AccountsAdmin">الحسابات</a></li>
        </ul>
        <div class="OptionsContainer">
            <button class="OptionsToggle" onclick="toggleOptions()">الاعدادات</button>
            <div id="OptionsList" class="SubMenu">
                <a href="/OptionsAdmin/College">الكلية-القسم</a>
            </div>
        </div>
    </div>
</body>

</html>
